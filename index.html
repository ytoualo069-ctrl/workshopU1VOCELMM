<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop Vocabulary – Heavy Machinery</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0f2a43;color:#1b2733}
.app{max-width:820px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 14px #0004}
h1{margin:0 0 4px;font-size:22px;color:#0f2a43}
h2{margin:0 0 8px;font-size:18px;color:#e67e00}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:0;border-radius:20px;padding:6px 10px;font-size:12px;background:#dde6ee;cursor:pointer}
.chip.on{background:#e67e00;color:#fff}
.pic{height:300px;display:flex;align-items:center;justify-content:center;background:#f0f3f6;border-radius:10px;overflow:hidden;margin:8px 0}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.ph{color:#888;font-size:13px;text-align:center;padding:10px}
.en{font-size:22px;font-weight:700;text-align:center;color:#0f2a43}
.es{font-size:17px;text-align:center;color:#555;margin-top:4px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
button.b{background:#0f2a43;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer}
button.b.o{background:#e67e00}
button.b:disabled{opacity:.4}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:560px){.opts{grid-template-columns:1fr}.pic{height:220px}}
.opt{background:#eef3f8;border:2px solid #cfdbe7;border-radius:10px;padding:10px;font-size:15px;cursor:pointer;text-align:left}
.opt.ok{background:#c8f0d2;border-color:#2e9e4f}
.opt.bad{background:#f8d0d0;border-color:#c0392b}
input.t{width:100%;padding:12px;font-size:18px;border:2px solid #cfdbe7;border-radius:10px;margin-top:8px}
.fb{margin-top:10px;padding:10px;border-radius:10px;font-size:16px}
.fb.ok{background:#c8f0d2}.fb.bad{background:#f8d0d0}
.bar{height:8px;background:#dde6ee;border-radius:5px;overflow:hidden;margin-bottom:8px}
.bar div{height:100%;background:#e67e00}
.score{font-size:48px;font-weight:800;text-align:center;color:#e67e00}
.c{text-align:center}
</style>
</head>
<body>
<div class="app"><div class="card" id="root"></div></div>
<script>
// ====== CONFIG ======
// Carpeta de imágenes, junto a index.html. Debe acabar en "/"
const IMG_BASE = 'img/';
const EXT = '.jpg';
const QUESTIONS_PER_LEVEL = 15;

// ====== DATA (file names: 01-01.jpg = category 1, item 1) ======
const CATS = [
 ["1. Workshop Areas & Heavy Machinery Facilities",[
  ["Service Bay / Workstation","Puesto de trabajo / Box de electromecánica"],
  ["Heavy-Duty Lift / Column Hoist","Elevador de gran tonelaje / columnas"],
  ["Parts Department / Counter","Mostrador de recambios / Almacén OEM"],
  ["Tool Trolley / Cabinet","Carro de herramientas"],
  ["Workbench & Bench Vise","Banco de trabajo y tornillo de banco"],
  ["Oil Drain & Waste Management Area","Zona de vaciado de aceite y gestión de residuos"],
  ["Eyewash Station & First Aid Kit","Estación lavaojos y botiquín"]]],
 ["2. Essential Hand & Precision Tools",[
  ["Combination Wrench / Spanner","Llave fija-combinada"],
  ["Socket Wrench & Sockets (Shallow / Deep)","Carraca y vasos (cortos / largos)"],
  ["Torque Wrench","Llave dinamométrica"],
  ["Allen Key (Hex) & Torx Bits","Llaves Allen y puntas Torx"],
  ["Locking Pliers (Vice-Grips)","Alicates de presión / Grip"],
  ["Feeler Gauge","Galga de espesores"],
  ["Vernier Caliper & Micrometer","Pie de rey / Calibre y micrómetro"]]],
 ["3. Power, Pneumatic & Heavy Workshop Equipment",[
  ["Impact Gun / Impact Wrench","Pistola de impacto"],
  ["Pneumatic Ratchet & Air Compressor","Carraca neumática y compresor"],
  ["Hydraulic Press","Prensa hidráulica"],
  ["Engine Crane / Shop Crane","Pluma de taller / Grúa de motores"],
  ["Transmission Jack & Jack Stands","Gato de transmisiones y borriquetas / caballetes"],
  ["Diagnostic Scan Tool / OBD Scanner","Equipo / Maletín de diagnosis"]]],
 ["4. Machinery Systems, Parts & OEM Components",[
  ["Engine & Powertrain","Motor y tren de potencia"],
  ["Tracks & Undercarriage","Orugas y tren de rodaje"],
  ["Hydraulic Arm / Boom & Cylinder","Brazo hidráulico / Cilindro / Botella hidráulica"],
  ["Hydraulic Hose & Fittings","Manguito hidráulico y racores"],
  ["Fuel Injector & Injection Pump","Inyector y bomba de inyección diésel"],
  ["Alternator, Starter Motor & Battery","Alternador, motor de arranque y batería"],
  ["Wiring Harness & Connectors","Manguera eléctrica / Cableado y conectores"]]],
 ["5. Fasteners, Hardware & Consumables",[
  ["Bolt, Nut & Lock Nut","Perno/Tornillo, tuerca y tuerca autoblocante"],
  ["Flat Washer & Spring Washer (Grower)","Arandela plana y arandela Grower"],
  ["Circlip / Snap Ring","Anillo de retención / Circlip"],
  ["Hose Clamp / Jubilee Clip","Abrazadera de manguito"],
  ["Brake Cleaner & Penetrating Oil","Limpiador de frenos y aflojatodo"],
  ["RTV Silicone / Gasket Maker","Silicona de juntas"],
  ["Threadlocker (e.g., Loctite)","Fijador de roscas"]]],
 ["6. Technical Acronyms, Display Messages & Diagnostics",[
  ["ECU (Engine Control Unit)","Unidad de control del motor"],
  ["DTC (Diagnostic Trouble Code)","Código de avería / fallo"],
  ["CAN-Bus","Red de comunicación entre centralitas"],
  ["TDI / Common Rail","Inyección directa diésel"],
  ["PHEV / EV","Vehículo híbrido enchufable / Vehículo eléctrico"],
  ["OEM (Original Equipment Manufacturer)","Fabricante de equipo original / Recambio original"],
  ["Display Messages","\"Warning: Low Hydraulic Pressure\", \"Check Engine\", \"DPF Regeneration Required\""]]],
 ["7. Units of Measurement & Imperial System Conversions",[
  ["Inches (in / \") & Feet (ft / ')","Pulgadas y pies"],
  ["PSI (Pounds per Square Inch) vs. Bar","Presión de neumáticos e hidráulica"],
  ["ft-lb / lb-ft (Foot-Pounds) vs. Nm","Par de apriete"],
  ["Gallons (gal) vs. Liters (L)","Capacidad de fluidos y depósitos"],
  ["Miles per Hour (mph) vs. Km/h","Velocidad y distancias"]]],
 ["8. Workshop Documents, Purchasing & Employability",[
  ["Work Order / Job Card","Parte de trabajo / Orden de taller"],
  ["Spare Parts Order / Request Form","Pedido de recambios / Piezas"],
  ["Estimate / Quote & Invoice","Presupuesto y factura"],
  ["Maintenance Checklist","Lista de chequeo de mantenimiento preventivo"],
  ["Job Application & Technical CV","Solicitud de empleo y currículum técnico"]]]
];
const ITEMS=[];
CATS.forEach((c,ci)=>c[1].forEach((it,ii)=>ITEMS.push({cat:ci,en:it[0],es:it[1],
  img:IMG_BASE+String(ci+1).padStart(2,'0')+'-'+String(ii+1).padStart(2,'0')+EXT})));

// ====== HELPERS ======
const $=id=>document.getElementById(id), root=$('root');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=x=>x.toLowerCase().replace(/\band\b/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const d=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
const splitP=x=>x.split(/\s*(?:\/|&|,|\bvs\.?|\band\b)\s*/);
function accepted(en){const s=en.toLowerCase();
 const par=[...s.matchAll(/\(([^)]*)\)/g)].map(m=>m[1].replace(/^e\.g\.,?\s*/,''));
 const base=s.replace(/\([^)]*\)/g,' ');
 return [base,...splitP(base),...par.flatMap(p=>[p,...splitP(p)])].map(clean).filter(x=>x.length>2)}
function isRight(inp,en){const x=clean(inp);if(!x)return false;
 return accepted(en).some(a=>x===a||(a.length>6&&lev(x,a)<=(a.length>12?2:1)))}
function picHTML(it){return `<div class="pic"><img src="${it.img}" alt="" onerror="this.parentNode.innerHTML='<div class=ph>Image not found:<br>${it.img.split('/').pop()}</div>'"></div>`}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

// ====== HOME ======
function home(){root.innerHTML=`<h1>🔧 Workshop Vocabulary</h1>
<p>Heavy Machinery Electromechanics · Technical English</p>
<p>1️⃣ Study the slideshow by category.<br>2️⃣ Level 1: choose the correct name.<br>3️⃣ Level 2: type the name.</p>
<p class="c"><button class="b o" onclick="study(0,0)">▶ Start studying</button></p>`}

// ====== STUDY ======
let flat=[];
function study(ci,ii){
 const list=ITEMS.filter(i=>i.cat==ci), it=list[ii];
 root.innerHTML=`<div class="tabs">${CATS.map((c,k)=>`<button class="chip ${k==ci?'on':''}" onclick="study(${k},0)">${c[0].split('.')[0]}</button>`).join('')}</div>
 <h2>${CATS[ci][0]}</h2>
 <div class="bar"><div style="width:${(ii+1)/list.length*100}%"></div></div>
 ${picHTML(it)}<div class="en">${esc(it.en)}</div><div class="es">${esc(it.es)}</div>
 <div class="nav"><button class="b" ${ci+ii==0?'disabled':''} onclick="${ii>0?`study(${ci},${ii-1})`:`study(${ci-1},${CATS[ci-1]?CATS[ci-1][1].length-1:0})`}">◀ Back</button>
 <span>${ii+1} / ${list.length}</span>
 ${ii<list.length-1?`<button class="b" onclick="study(${ci},${ii+1})">Next ▶</button>`:
  ci<CATS.length-1?`<button class="b" onclick="study(${ci+1},0)">Next category ▶</button>`:
  `<button class="b o" onclick="startQuiz(1)">Start Level 1 ✔</button>`}</div>
 <p class="c"><button class="chip" onclick="startQuiz(1)">Skip to practice →</button></p>`}

// ====== QUIZ ======
let Q,qi,score,lvl,total=0,totalMax=0;
function startQuiz(l){lvl=l;Q=shuffle(ITEMS).slice(0,QUESTIONS_PER_LEVEL);qi=0;score=0;ask()}
function ask(){
 const it=Q[qi];
 let body;
 if(lvl==1){const same=shuffle(ITEMS.filter(x=>x.cat==it.cat&&x!==it));
  const others=shuffle(ITEMS.filter(x=>x.cat!=it.cat));
  const opts=shuffle([it,...same.slice(0,3),...others].slice(0,4).concat([]));
  const four=shuffle([it,...[...same,...others].slice(0,3)]);
  body=`<div class="opts">${four.map(o=>`<button class="opt" data-en="${esc(o.en)}" onclick="pick(this)">${esc(o.en)}</button>`).join('')}</div>`}
 else body=`<input class="t" id="ans" placeholder="Type the name in English…" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key=='Enter')check()"><p class="c"><button class="b o" onclick="check()">Check</button></p>`;
 root.innerHTML=`<h2>Level ${lvl} · Question ${qi+1} / ${Q.length}</h2><div class="bar"><div style="width:${qi/Q.length*100}%"></div></div>${picHTML(it)}${body}<div id="fb"></div>`;
 if(lvl==2)$('ans').focus()}
function feedback(ok,it){
 $('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'✅ Correct!':'❌ Not quite. The right answer is:'}<br><b>${esc(it.en)}</b> — ${esc(it.es)}</div>
 <p class="c"><button class="b o" onclick="next()">${qi<Q.length-1?'Next ▶':'See my score'}</button></p>`}
function pick(btn){const it=Q[qi];if(document.querySelector('.opt[disabled]'))return;
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.en==it.en)b.classList.add('ok')});
 const ok=btn.dataset.en==it.en;if(!ok)btn.classList.add('bad');else score++;feedback(ok,it)}
function check(){const it=Q[qi],a=$('ans');if(a.disabled)return;a.disabled=true;
 const ok=isRight(a.value,it.en);if(ok)score++;a.style.borderColor=ok?'#2e9e4f':'#c0392b';feedback(ok,it)}
function next(){qi++;qi<Q.length?ask():end()}
function end(){
 const pct=Math.round(score/Q.length*100);
 if(lvl==1)total=score; else total+=score; 
 const msg=pct>=90?'🏆 Outstanding! You are a vocabulary master. Try again to keep it sharp!':
  pct>=70?'👍 Great job! You are almost there. Restart and aim for 100%!':
  pct>=50?'💪 Good effort! Review the slideshow again and restart to improve your level.':
  '📚 Keep going! Everyone starts somewhere. Restart the app, study the slideshow and beat this score!';
 root.innerHTML=`<h2>Level ${lvl} completed</h2><div class="score">${score} / ${Q.length}</div><p class="c" style="font-size:18px">${pct}%</p>
 <p class="c" style="font-size:17px">${msg}</p>
 <p class="c">${lvl==1?`<button class="b o" onclick="startQuiz(2)">Go to Level 2 ⌨</button> `:''}
 <button class="b" onclick="home()">🔄 Restart app</button></p>`}
home();
</script>
</body>
</html>
